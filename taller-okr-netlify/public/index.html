<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller de OKRs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F5F3FF; --ink:#1E1B4B; --muted:#6B7280; --card:#fff; --pri:#6C4CF1; --pri-d:#4B2FC9;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; --line:#E7E2FF; --r:20px;
  --sh:0 6px 24px rgba(76,52,200,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 10% 0%,#EDE9FE 0,transparent 35%),radial-gradient(circle at 100% 30%,#FCE7F3 0,transparent 30%);
  background-attachment:fixed;min-height:100vh;font-size:16px}
h1,h2,h3,.brand,.wow{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:.3em 0}
button{font:inherit}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer;transition:transform .08s, box-shadow .1s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.btn.primary:active{box-shadow:0 2px 0 var(--pri-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 4px 0 #047857}
.btn.big{font-size:1.12rem;padding:14px 22px;border-radius:18px;font-family:'Baloo 2',sans-serif}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--pri);font-weight:800;cursor:pointer;text-decoration:underline;padding:4px}
input,textarea,select{font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(108,76,241,.15)}
input:disabled,textarea:disabled,select:disabled{background:#F9FAFB;color:#6B7280}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.hint{color:var(--muted);font-size:.9rem}
.lbl{display:block;font-weight:800;font-size:.92rem;margin:12px 0 6px}
.x{border:0;background:#F3F4F6;border-radius:10px;cursor:pointer;width:30px;height:30px;font-size:1rem;flex:none;display:grid;place-items:center}
.x:hover{background:#FEE2E2}
.warn{background:#FFF7E6;border:2px solid #FCD34D;border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700;font-size:.92rem}
.okbox{background:#ECFDF5;border:2px solid #6EE7B7;border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:.82rem;background:#EEF2FF}
.container{max-width:1200px;margin:0 auto;padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Landing ---------- */
.landing{max-width:1000px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;margin-bottom:28px}
.logo-big{font-size:4.5rem;animation:float 3s ease-in-out infinite}
.hero h1{font-size:3rem;background:linear-gradient(90deg,#6C4CF1,#EC4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.2rem;color:#4B5563;max-width:620px;margin:8px auto 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.choice-card{text-align:center;padding:28px}
.choice-card .ce{font-size:3.2rem}
.choice-card form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.code-input{text-align:center;font-size:1.8rem;letter-spacing:.3em;font-weight:900;text-transform:uppercase;font-family:'Baloo 2',sans-serif}
.demo-box{margin-top:22px;text-align:center;background:#fff;border:2px dashed #C4B5FD;border-radius:18px;padding:14px}
.demo-box .row{justify-content:center;margin-top:8px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.how .card{text-align:center}
.how .e{font-size:2.2rem}

/* ---------- Shell (admin / client) ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
.brand{font-size:1.3rem;display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.tile{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px;display:flex;gap:12px;align-items:center}
.tile .te{font-size:2rem}
.tile .tn{font-family:'Baloo 2';font-size:1.8rem;line-height:1}
.tile .tl{color:var(--muted);font-weight:700;font-size:.88rem}
.client-grid,.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:12px}
.client-card h3{display:flex;gap:8px;align-items:center}
.vbar{height:10px;border-radius:10px;background:#F3F4F6;overflow:hidden;margin:10px 0 6px}
.vbar>div{height:100%;border-radius:10px}
.cc-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.client-hero{display:flex;gap:18px;align-items:center;padding:24px;background:linear-gradient(120deg,#6C4CF1,#A855F7 60%,#EC4899);color:#fff;border-radius:26px;box-shadow:var(--sh)}
.client-hero .he{font-size:3.4rem}
.client-hero h1{font-size:2.2rem}
.ws-card{cursor:pointer;transition:transform .15s}
.ws-card:hover{transform:translateY(-4px)}
.ws-card .wsc-top{display:flex;align-items:center;gap:12px}
.ws-card .wsc-ic{font-size:2.2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#F5F3FF}
.mini-journey{display:flex;gap:6px;margin:14px 0 8px}
.mini-journey span{flex:1;height:8px;border-radius:8px;background:#EDE9FE}
.mini-journey span.on{background:var(--pri)}
.add-card{border:3px dashed #C4B5FD;background:rgba(255,255,255,.6);border-radius:var(--r);min-height:160px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:2.4rem;color:var(--pri);font-weight:900;transition:.15s}
.add-card span{font-size:1rem}
.add-card:hover{background:#fff;transform:translateY(-2px)}
.add-card.wide{min-height:70px;flex-direction:row;font-size:1.1rem;width:100%}
.empty{text-align:center;padding:40px 20px}
.empty .ee{font-size:4rem}

/* ---------- Workshop ---------- */
.ws-title .t{font-family:'Baloo 2';font-size:1.25rem;line-height:1.1}
.ws-title .sub{color:var(--muted);font-weight:700;font-size:.85rem}
.hud{margin-left:auto;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.hud .lvl{font-weight:800;white-space:nowrap}
.xpbar{width:120px;height:12px;border-radius:12px;background:#EDE9FE;overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,#F59E0B,#EC4899,#8B5CF6);border-radius:12px;transition:width .6s}
.xpn{font-weight:900;white-space:nowrap;font-size:.92rem}
#saving{font-weight:700;color:var(--muted);font-size:.78rem;margin-left:4px}
.code-chip{border:0;background:#1E1B4B;color:#fff;border-radius:14px;padding:8px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
.code-chip b{letter-spacing:.12em;color:#FDE68A}
.ro-banner{background:#FEF2F2;color:#991B1B;text-align:center;font-weight:800;padding:10px}
.journey{display:flex;align-items:flex-start;padding:16px 20px 6px;overflow-x:auto;max-width:1300px;margin:0 auto}
.stop{flex:1;min-width:86px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;position:relative;color:var(--muted);padding:0}
.stop .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.55rem;background:#fff;border:3px solid var(--line);position:relative;z-index:1;transition:.2s}
.stop:not(:last-child)::after{content:'';position:absolute;top:25px;left:calc(50% + 30px);right:calc(-50% + 30px);height:5px;border-radius:5px;background:repeating-linear-gradient(90deg,#D9D3FB 0 8px,transparent 8px 14px)}
.stop.done:not(:last-child)::after{background:var(--sc)}
.stop.done .dot{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 18%,#fff)}
.stop.done .dot::after{content:'✓';position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;display:grid;place-items:center;font-weight:900;border:2px solid #fff}
.stop.current .dot{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 22%,#fff);transform:scale(1.18);animation:pulse 1.8s infinite}
.stop.locked{cursor:default;opacity:.55}
.stop.locked .dot{filter:grayscale(1)}
.stop .slbl{font-size:.78rem;font-weight:800;text-align:center;line-height:1.1}
.stop.current .slbl{color:var(--ink)}
.phase{max-width:1300px;margin:0 auto;padding:10px 20px 120px}
.phase-head{display:flex;gap:16px;align-items:center;margin:8px 0 10px}
.phase-icon{font-size:2.6rem;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 18%,#fff);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--pc) 40%,#fff);flex:none}
.phase-head .step{font-weight:900;color:var(--pc);text-transform:uppercase;font-size:.8rem;letter-spacing:.08em}
.phase-head h1{font-size:2.2rem}
.phase-head p{color:#4B5563;font-weight:700}
.coach{display:flex;gap:12px;align-items:flex-start;margin:6px 0 18px}
.owl{font-size:2.6rem;animation:float 3s ease-in-out infinite;flex:none}
.say{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);position:relative;font-weight:700;max-width:860px}
.say::before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say b{color:var(--pri)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 -1px 0 var(--line);z-index:15}
.bottom-nav .mid{flex:1;text-align:center;font-weight:800;color:var(--muted)}

.strip{display:flex;align-items:stretch;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.strip-i{flex:1;min-width:200px;display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--line);opacity:.7}
.strip-i.on{opacity:1;box-shadow:inset 0 0 0 3px var(--pc),var(--sh)}
.si-ic{font-size:1.9rem}
.si-q{font-weight:800;font-size:.9rem}
.si-ex{color:var(--muted);font-size:.8rem}
.strip-arrow{display:grid;place-items:center;font-size:1.4rem;color:#A78BFA}

/* contexto */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ctx .card-emoji{font-size:2.2rem}
.ctx h3{margin:4px 0}
.stickies{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.sticky{background:var(--sc);padding:12px 34px 12px 12px;border-radius:6px 6px 16px 6px;min-width:120px;max-width:220px;font-weight:700;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.08);transform:rotate(var(--rot,-1deg));animation:popIn .3s both}
.sticky .x{position:absolute;right:4px;top:4px;width:24px;height:24px;background:rgba(255,255,255,.6)}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}

/* ideas */
.steps3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step-pill{border:0;background:#fff;border-radius:999px;padding:10px 18px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;gap:8px;font-size:1.02rem}
.step-pill span{width:26px;height:26px;border-radius:50%;background:#EDE9FE;display:grid;place-items:center;font-size:.85rem}
.step-pill.on{background:var(--pc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 70%,#000)}
.step-pill.on span{background:rgba(255,255,255,.3)}
.steps3 .arrow{color:#A78BFA;font-weight:900}
.ideas-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.idea-input{display:flex;gap:10px;margin-top:12px}
.idea-input input{font-size:1.15rem;padding:14px 16px;border-radius:18px}
.side{display:flex;flex-direction:column;gap:14px}
.side-card .sc-t{font-family:'Baloo 2';font-size:1.1rem;margin-bottom:6px}
.join-card{text-align:center}
.join-code{font-family:'Baloo 2';font-size:2.4rem;letter-spacing:.2em;color:var(--pri);line-height:1}
.qr-small{display:flex;justify-content:center;margin:8px 0}
.qr-small img,.qr-small canvas{border-radius:10px}
.join-card .hint{word-break:break-all;font-size:.75rem}
.timer{font-family:'Baloo 2';font-size:2.6rem;text-align:center;line-height:1}
.timer.low{color:var(--bad);animation:pulse 1s infinite}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.people li{display:flex;align-items:center;gap:8px;font-weight:800;background:#F9FAFB;border-radius:12px;padding:6px 10px}
.people .av{font-size:1.4rem}
.people .xp{margin-left:auto;color:var(--pri);font-size:.85rem}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#F9FAFB;cursor:pointer;font-weight:700;font-size:.9rem;border:2px solid transparent}
.rank li.sel{border-color:var(--pri);background:#F5F3FF}
.rank .rt{flex:1}
.rank .medal{width:26px;text-align:center}

.mindmap{position:relative;height:560px;border-radius:26px;background:#fff;background-image:radial-gradient(circle at center,#F3F0FF 0,#fff 55%);box-shadow:var(--sh);overflow:hidden}
.mindmap.small{height:440px}
.mm-links{position:absolute;inset:0;pointer-events:none}
.mm-links path{fill:none;stroke-width:3;stroke-linecap:round;opacity:.55}
.mm-node{position:absolute;transform:translate(-50%,-50%);max-width:170px;padding:10px 12px;border-radius:18px;background:var(--nc);box-shadow:0 4px 12px rgba(30,27,75,.10);font-weight:800;font-size:.9rem;text-align:center;line-height:1.2;z-index:1;transition:transform .15s, box-shadow .15s}
.mm-node.new{animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
.mm-node.lvl0{background:linear-gradient(135deg,#6C4CF1,#A855F7);color:#fff;max-width:240px;padding:16px 20px;font-size:1.1rem;border-radius:28px;z-index:2;font-family:'Baloo 2'}
.mm-node.lvl1.boxed{background:#fff;border:3px solid var(--nc);max-width:190px}
.mm-node.lvl2{font-size:.78rem;max-width:150px;background:#fff;border:2px dashed var(--nc);font-weight:700}
.mm-text{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mm-meta{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;font-size:.85rem}
.star-btn{border:0;background:#fff;border-radius:999px;padding:3px 10px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.star-btn:hover{transform:scale(1.1)}
.node-x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;font-size:.8rem;display:none;box-shadow:0 2px 6px rgba(0,0,0,.15);background:#fff}
.mm-node:hover .node-x{display:grid}
.mm-node.pickable{cursor:pointer}
.mm-node.pickable:hover{transform:translate(-50%,-50%) scale(1.06);z-index:3}
.mm-node.sel{outline:4px solid var(--pri);outline-offset:3px}
.mm-node.sel::before{content:'🎯';position:absolute;top:-16px;left:-12px;font-size:1.4rem}
.mm-node.dim{opacity:.45}
.wall-wrap{position:absolute;inset:0;overflow:auto;padding:16px}
.wall-center{display:flex;justify-content:center;margin-bottom:14px}
.wall-center .mm-node{position:relative;transform:none;left:auto;top:auto}
.wall{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wall .mm-node{position:relative;transform:none;left:auto;top:auto}
.wall .mm-node.pickable:hover{transform:scale(1.05)}
.wall .mm-node.new{animation:popIn .35s both}

/* objetivos */
.obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card.obj{border-top:8px solid var(--oc)}
.obj-top{display:flex;align-items:center;justify-content:space-between}
.obj-num,.kr-num{font-family:'Baloo 2';font-size:1.15rem;color:var(--oc,var(--pri))}
.big-text{font-size:1.15rem;font-weight:800}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle2>button,.radio-card span{border:0;background:#F9FAFB;border-radius:14px;padding:10px;cursor:pointer;font-weight:800;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;width:100%}
.toggle2>button small{font-weight:700;color:var(--muted);font-size:.75rem}
.toggle2>button.on{background:#F5F3FF;box-shadow:inset 0 0 0 3px var(--pri)}
.radio-card{display:block;cursor:pointer}
.radio-card input{position:absolute;opacity:0;pointer-events:none}
.radio-card input:checked+span{background:#F5F3FF;box-shadow:inset 0 0 0 3px var(--pri)}
.radio-card span small{font-weight:700;color:var(--muted);font-size:.75rem}
.checks{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.checks li{font-weight:700;color:var(--muted);font-size:.9rem}
.checks li.ok{color:#047857}
.stars{font-size:1.6rem;color:#F59E0B;letter-spacing:2px;margin-top:10px}
.live{border-top:2px dashed var(--line);margin-top:14px;padding-top:6px}

/* krs */
.obj-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;gap:8px;max-width:360px;text-align:left}
.tab.on{box-shadow:inset 0 0 0 3px var(--oc);background:color-mix(in srgb,var(--oc) 10%,#fff)}
.tab .badge{background:var(--oc);color:#fff;border-radius:999px;padding:1px 8px;font-size:.8rem}
.kr-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.kr-layout .mapcard{padding:0;position:sticky;top:80px}
.kr-list{display:flex;flex-direction:column;gap:14px}
.card.kr{border-left:8px solid var(--oc)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.unit{border:0;background:#F9FAFB;border-radius:14px;padding:8px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center}
.unit b{font-size:1.5rem;font-family:'Baloo 2';line-height:1}
.unit small{font-weight:800;color:var(--muted)}
.unit.on{background:#F5F3FF;box-shadow:inset 0 0 0 3px var(--pri)}
.row3{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.row3 input{font-size:1.2rem;font-weight:900;text-align:center}
.arrowbig{font-size:1.8rem;color:#A78BFA;padding-bottom:6px}
.sentence{background:#F5F3FF;border-radius:14px;padding:12px;font-weight:900;font-size:1.05rem;margin-top:6px}
.thermo{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;font-size:.85rem}
.thermo .tb{flex:1;height:14px;border-radius:14px;background:linear-gradient(90deg,#FDE68A,#34D399);position:relative}

/* iniciativas */
.ini-obj{margin-bottom:24px}
.ini-obj h2{display:flex;gap:8px;align-items:center;margin-bottom:10px;border-left:8px solid var(--oc);padding-left:12px}
.ini-krs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.kr-sentence{font-weight:900;font-size:1.02rem;background:color-mix(in srgb,var(--oc) 10%,#fff);border-radius:12px;padding:10px 12px}

.bp-d{color:var(--muted);font-weight:700}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sc,#6C4CF1) 35%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.rtable th{background:#F5F3FF;text-align:left;padding:10px;font-weight:900;white-space:nowrap;position:sticky;top:0}

.rdetail{margin-top:26px;break-inside:avoid}

@media print{

  .phase{padding:0}
  .trophy{animation:none}
}

  ws:null, active:true, ideas:[], people:[], seen:new Set(), sig:'', krTab:null, revTab:'poster',
  timerEnd:null, signup:false, joinCode:'', part:null, pPub:null, pIdeas:[], pPeople:[], pVotes:[], pXp:0
};

const LS_KEY = 'okr_taller_demo_v1';
let MEM = null;
function seedDemo(){
  const t = todayISO();
  return {
    clients:[
      {id:'c-demo', name:'Empresa Demo', contact:'Contacto Demo', valid_from:addDays(t,-30), valid_to:addDays(t,90), status:'activo'},
      {id:'c-venc', name:'Cliente Vencido S.A.', contact:'', valid_from:addDays(t,-200), valid_to:addDays(t,-5), status:'activo'}
    ],
    users:[
      {email:'super@demo.com', pass:'demo', role:'superadmin'},
      {email:'admin@demo.com', pass:'demo', role:'client_admin', client_id:'c-demo'},
      {email:'vencido@demo.com', pass:'demo', role:'client_admin', client_id:'c-venc'}
    ],
    workshops:[], ideas:[], participants:[], votes:[]
  };
}
function dLoad(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { MEM = JSON.parse(raw); return MEM; } } catch(e){}
  if (!MEM) { MEM = seedDemo(); dSave(MEM); }
  return MEM;
}
function dSave(db){ MEM = db; try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch(e){} }
function dWs(db, code){ return db.workshops.find(w => w.code.toUpperCase() === String(code||'').trim().toUpperCase()); }
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };

const DemoStore = {
  async signIn(email, pass){
    const u = dLoad().users.find(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.pass === pass);
    if (!u) throw new Error('Correo o contraseña incorrectos');
    lsSet('okr_sess', u.email);
    return {email:u.email, role:u.role, client_id:u.client_id || null};
  },
  async current(){
    const e = lsGet('okr_sess'); if (!e) return null;
    const u = dLoad().users.find(u => u.email === e);
    return u ? {email:u.email, role:u.role, client_id:u.client_id || null} : null;
  },
  async signOut(){ lsDel('okr_sess'); },
  async listClients(){ return [...dLoad().clients].sort((a,b) => a.name.localeCompare(b.name)); },
  async getClient(id){ return dLoad().clients.find(c => c.id === id) || null; },
  async saveClient(c){
    const db = dLoad();
    if (!c.id) { c.id = uid(); db.clients.push(c); }
    else { const i = db.clients.findIndex(x => x.id === c.id); db.clients[i] = {...db.clients[i], ...c}; }
    dSave(db); return c;
  },
  async setUser(email, password, clientId){
    const db = dLoad(); email = email.trim().toLowerCase();
    if (String(password || '').length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres');
    let u = db.users.find(u => u.email.toLowerCase() === email);
    if (u && u.role === 'superadmin') throw new Error('Ese correo es el del super administrador');
    if (!u) { db.users.push({email, pass:password, role:'client_admin', client_id:clientId}); dSave(db); return 'Usuario creado ✅'; }
    u.pass = password; u.role = 'client_admin'; u.client_id = clientId; dSave(db); return 'Contraseña actualizada y usuario asignado ✅';
  },
  async deleteUser(email){ const db = dLoad(); db.users = db.users.filter(u => u.email !== email || u.role === 'superadmin'); dSave(db); },
  async live(code, pid){
    const pub = await this.wsPublic(code);
    if (!pub) return {pub:null, ideas:[], people:[], myVotes:[]};
    return {pub, ideas:await this.listIdeas(code, pid), people:await this.listPeople(code, pid), myVotes:pid ? await this.myVotes(pid) : []};
  },
  async adminsMap(){
    const m = {}; dLoad().users.filter(u => u.client_id).forEach(u => (m[u.client_id] = m[u.client_id] || []).push(u.email)); return m;
  },
  async workshopCounts(){ const m = {}; dLoad().workshops.forEach(w => m[w.client_id] = (m[w.client_id]||0)+1); return m; },
  async listWorkshops(cid){ return dLoad().workshops.filter(w => w.client_id === cid).sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||'')); },
  async getWorkshop(id){ const w = dLoad().workshops.find(w => w.id === id); if (!w) throw new Error('Taller no encontrado'); return JSON.parse(JSON.stringify(w)); },
  async createWorkshop(w){
    const db = dLoad(); w.id = uid(); w.code = newCode(db.workshops.map(x => x.code));
    w.created_at = w.updated_at = new Date().toISOString(); db.workshops.push(w); dSave(db); return w;
  },
  async saveWorkshop(w){
    const db = dLoad(); const i = db.workshops.findIndex(x => x.id === w.id);
    w.updated_at = new Date().toISOString();
    if (i >= 0) db.workshops[i] = JSON.parse(JSON.stringify(w));
    dSave(db);
  },
  async deleteClient(id){
    const db = dLoad();
    const wsIds = db.workshops.filter(w => w.client_id === id).map(w => w.id);
    const ideaIds = db.ideas.filter(i => wsIds.includes(i.workshop_id)).map(i => i.id);
    db.clients = db.clients.filter(c => c.id !== id);
    db.workshops = db.workshops.filter(w => w.client_id !== id);
    db.ideas = db.ideas.filter(i => !wsIds.includes(i.workshop_id));
    db.participants = db.participants.filter(p => !wsIds.includes(p.workshop_id));
    db.votes = db.votes.filter(v => !ideaIds.includes(v.idea_id));
    db.users = db.users.filter(u => u.client_id !== id);
    dSave(db);
  },
  async workshopStats(cid){
    const db = dLoad(), m = {};
    db.workshops.filter(w => w.client_id === cid).forEach(w => { m[w.id] = {ideas:db.ideas.filter(i => i.workshop_id === w.id).length, participants:db.participants.filter(p => p.workshop_id === w.id).length}; });
    return m;
  },
  async deleteWorkshop(id){
    const db = dLoad(); db.workshops = db.workshops.filter(w => w.id !== id);
    db.ideas = db.ideas.filter(i => i.workshop_id !== id); db.participants = db.participants.filter(p => p.workshop_id !== id); dSave(db);
  },
  async wsPublic(code){
    const db = dLoad(); const w = dWs(db, code); if (!w) return null;
    const c = db.clients.find(c => c.id === w.client_id);
    return {id:w.id, name:w.name, area:w.area, period_label:w.period_label, phase:w.phase, idea_step:(w.data && w.data.ideaStep) || 'proponer', active:isActive(c)};
  },
  async join(code, name, avatar){
    const pub = await this.wsPublic(code);
    if (!pub) throw new Error('No encontramos ese código 🤔');
    if (!pub.active) throw new Error('La licencia de este taller no está vigente');
    const db = dLoad(); const p = {id:uid(), workshop_id:pub.id, name, avatar, xp:0};
    db.participants.push(p); dSave(db);
    return {participant:p, workshop:pub};
  },
  async listIdeas(code, pid){
    const db = dLoad(); const w = dWs(db, code); if (!w) return [];
    return db.ideas.filter(i => i.workshop_id === w.id).sort((a,b) => a.created_at.localeCompare(b.created_at))
      .map(i => ({id:i.id, author:i.author, avatar:i.avatar, text:i.text, votes:i.votes, created_at:i.created_at, mine:!!pid && i.participant_id === pid}));
  },
  async addIdea(code, pid, author, avatar, text){
    const db = dLoad(); const w = dWs(db, code); if (!w) throw new Error('Código no encontrado');
    if (!isActive(db.clients.find(c => c.id === w.client_id))) throw new Error('La licencia no está vigente');
    const idea = {id:uid(), workshop_id:w.id, participant_id:pid, author, avatar, text:text.slice(0,200), votes:0, created_at:new Date().toISOString()};
    db.ideas.push(idea);
    if (pid) { const p = db.participants.find(p => p.id === pid); if (p) p.xp += 10; }
    dSave(db); return idea;
  },
  async voteIdea(code, pid, ideaId){
    const db = dLoad(); const idea = db.ideas.find(i => i.id === ideaId); if (!idea) throw new Error('Idea no encontrada');
    if (!pid) { idea.votes++; dSave(db); return {ok:true, votes:idea.votes}; }
    const p = db.participants.find(p => p.id === pid);
    const had = db.votes.find(v => v.participant_id === pid && v.idea_id === ideaId);
    if (had) {
      db.votes = db.votes.filter(v => v !== had); idea.votes = Math.max(0, idea.votes-1); if (p) p.xp = Math.max(0, p.xp-2);
      dSave(db); return {ok:true, voted:false, votes:idea.votes, remaining:5 - db.votes.filter(v => v.participant_id === pid).length};
    }
    const used = db.votes.filter(v => v.participant_id === pid).length;
    if (used >= 5) return {ok:false, msg:'Ya usaste tus 5 estrellas. Quita una para mover tu voto.', remaining:0};
    db.votes.push({participant_id:pid, idea_id:ideaId}); idea.votes++; if (p) p.xp += 2;
    dSave(db); return {ok:true, voted:true, votes:idea.votes, remaining:4 - used};
  },
  async myVotes(pid){ return dLoad().votes.filter(v => v.participant_id === pid).map(v => v.idea_id); },
  async deleteIdea(id){ const db = dLoad(); db.ideas = db.ideas.filter(i => i.id !== id); db.votes = db.votes.filter(v => v.idea_id !== id); dSave(db); },
  async listPeople(code, pid){
    const db = dLoad(); const w = dWs(db, code); if (!w) return [];
    return db.participants.filter(p => p.workshop_id === w.id).map(p => ({name:p.name, avatar:p.avatar, xp:p.xp, me:!!pid && p.id === pid}));
  }
};

let TOKEN = null;
try { TOKEN = localStorage.getItem('okr_token'); } catch(e) {}
async function api(action, payload = {}){
  let r, j;
  try {
    r = await fetch('/api', {method:'POST', headers:Object.assign({'content-type':'application/json'}, TOKEN ? {authorization:'Bearer ' + TOKEN} : {}), body:JSON.stringify(Object.assign({action}, payload))});
    j = await r.json();
  } catch(e) { throw new Error('Sin conexión con el servidor. Revisa tu internet.'); }
  if (!r.ok || j.error) {
    if (r.status === 401 && action !== 'login') { TOKEN = null; lsDel('okr_token'); }
    throw new Error(j.error || 'Error del servidor');
  }
  return j.data;
}
const ApiStore = {
  async signIn(email, pass){ const r = await api('login', {email, pass}); TOKEN = r.token; lsSet('okr_token', TOKEN); return r.user; },
  async current(){ if (!TOKEN) return null; try { return await api('me'); } catch(e) { return null; } },
  async signOut(){ TOKEN = null; lsDel('okr_token'); },
  listClients: () => api('listClients'),
  getClient: id => api('getClient', {id}),
  saveClient: c => api('saveClient', {client:c}),
  deleteClient: id => api('deleteClient', {id}),
  setUser: (email, password, client_id) => api('setUser', {email, password, client_id}),
  deleteUser: email => api('deleteUser', {email}),
  adminsMap: () => api('adminsMap'),
  workshopCounts: () => api('workshopCounts'),
  listWorkshops: cid => api('listWorkshops', {client_id:cid}),
  getWorkshop: id => api('getWorkshop', {id}),
  createWorkshop: w => api('createWorkshop', {ws:w}),
  saveWorkshop: w => api('saveWorkshop', {ws:{id:w.id, name:w.name, phase:w.phase, data:w.data}}),
  deleteWorkshop: id => api('deleteWorkshop', {id}),
  workshopStats: cid => api('workshopStats', {client_id:cid}),
  wsPublic: code => api('wsPublic', {code}),
  join: (code, name, avatar) => api('join', {code, name, avatar}),

  addIdea: (code, pid, author, avatar, text) => api('addIdea', {code, pid:pid || null, author, avatar, text}),

  deleteIdea: (id, code) => api('deleteIdea', {id, code})
};

/* ---------------- reglas de negocio ---------------- */
function isActive(c){ if (!c || c.status !== 'activo') return false; const t = todayISO(); return t >= String(c.valid_from).slice(0,10) && t <= String(c.valid_to).slice(0,10); }
function clientStatus(c){
  const t = todayISO();
  if (c.status !== 'activo') return {k:'susp', label:'⏸️ Suspendido', color:'#6B7280'};
  if (t < c.valid_from) return {k:'pend', label:'⏳ Inicia ' + fmtDate(c.valid_from), color:'#3B82F6'};
  if (t > c.valid_to) return {k:'venc', label:'⛔ Vencido', color:'#EF4444'};
  const d = daysBetween(t, c.valid_to);
  if (d <= 15) return {k:'pronto', label:`⚠️ Vence en ${d} día${d===1?'':'s'}`, color:'#F59E0B', days:d};
  return {k:'ok', label:`✅ Activo · ${d} días`, color:'#10B981', days:d};
}
function newWorkshopData(){
  return {context:{mision:'', vision:'', dolores:[], oportunidades:[]}, ideaStep:'proponer', selected:[], objectives:[], xp:0, awarded:{}, badges:[], maxPhase:0};
}
function ensureData(w){
  const base = newWorkshopData(); w.data = Object.assign(base, w.data || {});
  w.data.context = Object.assign(newWorkshopData().context, w.data.context || {});
  w.data.objectives.forEach(o => { o.krs = o.krs || []; o.parking = o.parking || []; o.krs.forEach(k => { k.initiatives = k.initiatives || []; k.checkins = k.checkins || []; }); });
  w.phase = w.phase || 0;
  return w;
}
const RO = () => S.view === 'ws' && !S.active;
function blocked(){ if (RO()) { toast('🔒 La licencia terminó: solo lectura', 'warn'); return true; } return false; }
const validObjs = () => S.ws.data.objectives.filter(o => (o.text || '').trim());
function krComplete(k){ return !!((k.metric||'').trim() && k.unit && isNum(k.base) && isNum(k.target) && Number(k.base) !== Number(k.target) && !isTaskLike(k.metric)); }
function isTaskLike(t){ const w = norm(t).trim().split(/\s+/)[0] || ''; return TASK_VERBS.includes(w); }
function startsWithVerb(t){ const w = norm(t).trim().split(/\s+/)[0] || ''; return /^(ser|ir|[a-zñ]{2,}(ar|er|ir))(nos|se|lo|la)?$/.test(w); }
function krSentence(k){
  if (!(k.metric||'').trim()) return '';
  if (!isNum(k.base) || !isNum(k.target)) return k.metric;
  const up = Number(k.target) >= Number(k.base);
  return `${up ? '⬆️ Subir' : '⬇️ Bajar'} ${k.metric} de ${fmtVal(k.base, k.unit)} a ${fmtVal(k.target, k.unit)}`;
}
function krCurrent(k){ return isNum(k.current) ? Number(k.current) : Number(k.base); }
function krProgress(k){
  if (!krComplete(k)) return 0;
  const b = Number(k.base), t = Number(k.target);
  return clamp((krCurrent(k) - b) / (t - b), 0, 1);
}
function elapsed(){
  const w = S.ws; if (!w.period_start || !w.period_end) return 0;
  return clamp(daysBetween(w.period_start, todayISO()) / Math.max(1, daysBetween(w.period_start, w.period_end)), 0, 1);
}
function krStatus(k){
  const p = krProgress(k), e = elapsed();
  if (p >= 1) return {c:'#EAB308', t:'🥇 ¡Logrado!'};
  if (p >= e - 0.10) return {c:'#10B981', t:'🟢 En camino'};
  if (p >= e - 0.25) return {c:'#F59E0B', t:'🟡 Atención'};
  return {c:'#EF4444', t:'🔴 En riesgo'};
}
function allKRs(){ return validObjs().flatMap(o => o.krs); }
function allInis(){ return allKRs().flatMap(k => k.initiatives); }
function qualityItems(){
  const objs = validObjs(), krs = allKRs(), inis = allInis();
  return [
    {ok: objs.length >= 1 && objs.length <= 3, t:'Tienen de 1 a 3 objetivos', w:'Menos es más: así el equipo se enfoca.', ph:2},
    {ok: objs.length > 0 && objs.every(o => !/\d/.test(o.text)), t:'Los objetivos no tienen números', w:'El objetivo inspira; los números van en los resultados clave.', ph:2},
    {ok: objs.length > 0 && objs.every(o => (o.why||'').trim().length > 3), t:'Cada objetivo dice por qué importa', w:'Si sabemos el porqué, todos empujan.', ph:2},
    {ok: objs.length > 0 && objs.every(o => { const n = o.krs.filter(krComplete).length; return n >= 2 && n <= 4; }), t:'Cada objetivo tiene de 2 a 4 resultados clave', w:'Uno solo se queda corto; más de 4 distrae.', ph:3},
    {ok: krs.length > 0 && krs.every(krComplete), t:'Todos los resultados clave tienen "hoy" y "meta"', w:'Sin punto de partida no sabemos si avanzamos.', ph:3},
    {ok: krs.length > 0 && !krs.some(k => isTaskLike(k.metric)), t:'Ningún resultado clave parece tarea', w:'Las tareas van en "¿Qué vamos a hacer?".', ph:3},
    {ok: krs.length > 0 && krs.every(k => (k.owner||'').trim()), t:'Cada resultado clave tiene un dueño', w:'Lo que es de todos no es de nadie.', ph:3},
    {ok: krs.length > 0 && krs.every(k => k.initiatives.length > 0), t:'Cada resultado clave tiene al menos una acción', w:'Los números no se mueven solos.', ph:4},
    {ok: inis.length > 0 && inis.every(n => (n.owner||'').trim() && n.due), t:'Las acciones tienen responsable y fecha', w:'Quién y cuándo: así sí pasa.', ph:4}
  ];
}
function qualityScore(){ const it = qualityItems(); return Math.round(100 * it.filter(i => i.ok).length / it.length); }
function levelOf(xp){ let i = 0; LEVELS.forEach((l, j) => { if (xp >= l.xp) i = j; }); return {...LEVELS[i], i, next:LEVELS[i+1]}; }

/* ---------------- gamificación ---------------- */
function award(key, n, msg){
  if (RO() || !S.ws) return;
  const d = S.ws.data; if (d.awarded[key]) return;
  d.awarded[key] = 1;
  const before = levelOf(d.xp); d.xp += n;
  toast(`⚡ +${n} XP · ${msg}`, 'xp');
  const after = levelOf(d.xp);
  if (after.i > before.i) setTimeout(() => showPop(after.e, '¡Subieron de nivel!', `Ahora son ${after.n}`, 'Sigan así, equipo'), 700);
  updateHud(); saveSoon();
}
function checkBadges(){
  if (!S.ws || RO()) return;
  const d = S.ws.data, objs = validObjs(), krs = allKRs();
  const cond = {
    primera_idea: S.ideas.length >= 1,
    diez_ideas:   S.ideas.length >= 10,
    primer_obj:   objs.length >= 1,
    primer_kr:    krs.some(krComplete),
    kr_completos: objs.length > 0 && objs.every(o => o.krs.filter(krComplete).length >= 2),
    iniciativas:  krs.length > 0 && krs.every(k => k.initiatives.length > 0),
    calidad:      qualityScore() >= 80,
    celebracion:  d.maxPhase >= 6,
    checkin:      krs.some(k => k.checkins.length > 0),
    kr_logrado:   krs.some(k => krProgress(k) >= 1)
  };
  Object.keys(cond).forEach(k => {
    if (cond[k] && !d.badges.includes(k)) {
      d.badges.push(k); const b = BADGES[k];
      showPop(b.icon, '¡Nueva medalla!', b.name, b.desc);
      d.xp += 20; updateHud(); saveSoon();
    }
  });
}
const popQ = []; let popOn = false;
function showPop(icon, t, n, desc){ popQ.push({icon, t, n, desc}); if (!popOn) nextPop(); }
function nextPop(){
  const p = popQ.shift(); const el = $('#pop');
  if (!p) { popOn = false; el.classList.remove('on'); el.innerHTML = ''; return; }
  popOn = true;
  el.innerHTML = `<div class="badge-pop"><div class="bp-ic">${p.icon}</div><div class="bp-t">${esc(p.t)}</div><div class="bp-n">${esc(p.n)}</div><div class="bp-d">${esc(p.desc)}</div></div>`;
  el.classList.add('on'); confetti(70);
  setTimeout(nextPop, 2600);
}
function toast(msg, type = ''){
  const el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 2800);
}
function confetti(n = 160){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#6C4CF1','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444','#FDE047'];
  const ps = Array.from({length:n}, () => ({x:Math.random()*cv.width, y:-20 - Math.random()*cv.height*0.4, vx:(Math.random()-.5)*5, vy:2+Math.random()*4, r:6+Math.random()*7, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  let t = 0; cancelAnimationFrame(confetti.raf);
  (function step(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore(); });
    t++; if (t < 260) confetti.raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------------- modales ---------------- */
function openModal(html){ $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); const f = $('#modalBox input:not([type=radio]):not([type=hidden])'); if (f) setTimeout(() => f.focus(), 50); }
function closeModal(){ $('#modal').classList.remove('on'); $('#modalBox').innerHTML = ''; }
function confirmBox(msg, ok = 'Sí', cancel = 'Cancelar'){
  return new Promise(res => {
    openModal(`<div style="text-align:center"><div style="font-size:3rem">🦉</div><h2>${OWL_NAME} pregunta…</h2><p style="font-weight:700;font-size:1.05rem;margin:10px 0 0">${msg}</p>
      <div class="modal-actions" style="justify-content:center"><button class="btn ghost big" id="cbNo">${esc(cancel)}</button><button class="btn primary big" id="cbYes">${esc(ok)}</button></div></div>`);
    $('#cbYes').onclick = () => { closeModal(); res(true); };
    $('#cbNo').onclick = () => { closeModal(); res(false); };
  });
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function stopTimers(){ clearInterval(pollT); pollT = null; clearInterval(partT); partT = null; }
function render(){
  const app = $('#app');
  if (S.view !== 'ws') clearInterval(pollT);
  switch (S.view) {
    case 'landing': app.innerHTML = vLanding(); break;
    case 'pending': app.innerHTML = vPending(); break;
    case 'super':   app.innerHTML = vSuper(); break;
    case 'client':  app.innerHTML = vClient(); break;
    case 'ws':      app.innerHTML = vWorkshop(); afterWorkshop(); break;
    case 'join':    app.innerHTML = vJoin(); break;
    case 'part':    app.innerHTML = vPart(); break;
    case 'report':  app.innerHTML = vReport(); break;
  }
}
async function goHome(){
  stopTimers();
  if (!S.user) { S.view = 'landing'; return render(); }
  try {
    if (S.user.role === 'superadmin') { await loadSuper(); }
    else if (S.user.role === 'client_admin' && S.user.client_id) { await loadClient(S.user.client_id); }
    else { S.view = 'pending'; render(); }
  } catch(e) { toast(e.message, 'err'); S.view = 'landing'; render(); }
}
async function loadSuper(){
  const [clients, counts, admins] = await Promise.all([Store.listClients(), Store.workshopCounts(), Store.adminsMap()]);
  S.clients = clients; S.counts = counts; S.admins = admins; S.view = 'super'; render();
}
async function loadClient(cid){
  S.client = await Store.getClient(cid);
  if (!S.client) throw new Error('No se encontró la empresa');
  S.workshops = await Store.listWorkshops(cid); S.active = isActive(S.client); S.view = 'client'; render();
}
async function openWorkshop(id){
  try {
    stopTimers();
    S.ws = ensureData(await Store.getWorkshop(id));
    if (!S.client || S.client.id !== S.ws.client_id) S.client = await Store.getClient(S.ws.client_id);
    S.active = isActive(S.client);
    const L = await Store.live(S.ws.code); S.ideas = L.ideas; S.people = L.people;
    S.seen = new Set(S.ideas.map(i => i.id)); S.sig = ''; S.krTab = null;
    S.view = 'ws'; render(); window.scrollTo(0, 0);
  } catch(e) { toast(e.message, 'err'); }
}

function periodInfo(type, start){
  const P = PERIODS.find(p => p.k === type) || PERIODS[1];
  const d = parseISO(start), y = d.getFullYear(), m = d.getMonth();
  let label = '';
  if (type === 'mes') { label = d.toLocaleDateString('es-MX', {month:'long', year:'numeric'}); label = label[0].toUpperCase() + label.slice(1); }
  else if (type === 'trimestre') label = `T${Math.floor(m/3)+1} ${y}`;
  else if (type === 'semestre') label = `S${m < 6 ? 1 : 2} ${y}`;
  else label = `Año ${y}`;
  return {label, end:addDays(addMonths(start, P.m), -1)};
}
function periodPreview(type, start){ const i = periodInfo(type, start); return `🗓️ <b>${esc(i.label)}</b> · del ${fmtDate(start)} al ${fmtDate(i.end)}`; }

/* ---------- Mapa mental genérico ---------- */
function drawMindMap(el, root, opts = {}){
  const W = el.clientWidth, H = el.clientHeight; if (!W) return;
  const kids = root.children || [], n = kids.length;
  // Muchas ideas o pantalla angosta: muro de burbujas
  if (opts.rings && (n > 36 || W < 620)) {
    el.innerHTML = `<div class="wall-wrap"><div class="wall-center"><div class="mm-node lvl0">${root.html}</div></div><div class="wall">${kids.map(k => `<div class="mm-node lvl1 ${k.cls||''}" style="--nc:${k.color}" ${k.attrs||''}>${k.html}</div>`).join('')}</div></div>`;
    return;
  }
  const cx = W/2, cy = H/2, nodes = [{...root, x:cx, y:cy, lvl:0}], links = [];
  if (opts.rings) {
    const caps = [8, 13, 17]; let idx = 0, ring = 0;
    while (idx < n) {
      const cap = caps[Math.min(ring, 2)], count = Math.min(cap, n - idx);
      const rx = W * (0.25 + 0.12*ring), ry = H * (0.25 + 0.105*ring), off = ring * 0.35;
      for (let j = 0; j < count; j++) {
        const a = -Math.PI/2 + off + j * 2*Math.PI / count, k = kids[idx + j];
        nodes.push({...k, x:cx + rx*Math.cos(a), y:cy + ry*Math.sin(a), lvl:1});
        links.push([0, nodes.length - 1, '#C4B5FD']);
      }
      idx += count; ring++;
    }
  } else {
    const R1x = W * 0.25, R1y = H * 0.27, R2x = W * 0.42, R2y = H * 0.42;
    kids.forEach((k, i) => {
      const a = -Math.PI/2 + i * 2*Math.PI / Math.max(n, 1);
      const pi = nodes.length; nodes.push({...k, x:cx + R1x*Math.cos(a), y:cy + R1y*Math.sin(a), lvl:1}); links.push([0, pi, k.color]);
      const g = k.children || [], m = g.length, wedge = Math.min(2*Math.PI / Math.max(n, 1) * 0.75, Math.PI * 0.55);
      g.forEach((c, j) => {
        const b = a + (m > 1 ? (j / (m - 1) - 0.5) * wedge : 0);
        nodes.push({...c, color:c.color || k.color, x:cx + R2x*Math.cos(b), y:cy + R2y*Math.sin(b), lvl:2}); links.push([pi, nodes.length - 1, k.color]);
      });
    });
  }
  nodes.forEach(nd => { const hw = nd.lvl === 0 ? 120 : nd.lvl === 1 ? 88 : 76; nd.x = clamp(nd.x, hw, W - hw); nd.y = clamp(nd.y, 36, H - 36); });
  const svg = `<svg class="mm-links" width="${W}" height="${H}">${links.map(([a, b, c]) => { const A = nodes[a], B = nodes[b], mx = (A.x + B.x)/2, my = (A.y + B.y)/2;
      return `<path d="M${A.x},${A.y} Q${mx + (B.y - A.y)*0.12},${my - (B.x - A.x)*0.12} ${B.x},${B.y}" stroke="${c || '#C4B5FD'}"/>`; }).join('')}</svg>`;
  el.innerHTML = svg + nodes.map(nd => `<div class="mm-node lvl${nd.lvl} ${nd.cls || ''}" style="left:${nd.x}px;top:${nd.y}px;--nc:${nd.color || '#6C4CF1'}" ${nd.attrs || ''}>${nd.html}</div>`).join('');
}

function donut(pct, size = 170, color){
  const r = size/2 - 14, c = 2*Math.PI*r, col = color || (pct >= 80 ? '#10B981' : pct >= 50 ? '#F59E0B' : '#EF4444');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDE9FE" stroke-width="16"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="Baloo 2" font-size="${size/4.2}" font-weight="800" fill="#1E1B4B">${pct}${size > 120 ? '' : '%'}</text></svg>`;
}

/* ---------- Fase 7: seguimiento ---------- */
function sparkline(k){
  const pts = [Number(k.base), ...k.checkins.map(c => Number(c.value))];
  if (pts.length < 2) return '';
  const all = [...pts, Number(k.target)], mn = Math.min(...all), mx = Math.max(...all), W = 180, H = 40;
  const xy = pts.map((v, i) => `${(i / (pts.length - 1)) * W},${H - 4 - ((v - mn) / Math.max(1e-9, mx - mn)) * (H - 8)}`).join(' ');
  const ty = H - 4 - ((Number(k.target) - mn) / Math.max(1e-9, mx - mn)) * (H - 8);
  return `<svg width="${W}" height="${H}" style="display:block;margin-top:6px"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="#10B981" stroke-dasharray="4 4"/><polyline points="${xy}" fill="none" stroke="#6C4CF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function pSeguimiento(){
  const objs = validObjs(), krs = allKRs().filter(krComplete);
  if (!krs.length) return `<div class="card empty"><div class="ee">📏</div><h2>Aún no hay resultados clave completos para seguir</h2><button class="btn primary" data-act="goto" data-i="3">Completar resultados clave</button></div>`;
  const overall = Math.round(100 * krs.reduce((s, k) => s + krProgress(k), 0) / krs.length);
  const el = Math.round(100 * elapsed());
  const conf = ['😟','😐','😀'];
  return `<div class="track-top">
      <div class="card ring-card">${donut(overall, 110, '#6C4CF1')}<div><div class="rt">Avance de OKRs</div><div class="hint">Promedio de todos los resultados clave · Calificación ${(overall/100).toFixed(1)}</div></div></div>
      <div class="card ring-card">${donut(el, 110, '#94A3B8')}<div><div class="rt">Tiempo transcurrido</div><div class="hint">${fmtDate(S.ws.period_start)} → ${fmtDate(S.ws.period_end)}</div></div></div>
      <div class="card"><div class="rt" style="font-family:'Baloo 2';font-size:1.2rem">¿Cómo leo los colores?</div><div class="legend">
        <span style="--c:#10B981">Verde: vamos al ritmo del tiempo</span><span style="--c:#F59E0B">Amarillo: un poco atrasados</span><span style="--c:#EF4444">Rojo: necesitamos ayuda</span><span style="--c:#EAB308">Dorado: ¡meta lograda!</span></div></div>
    </div>
    ${objs.map(o => {
      const ks = o.krs.filter(krComplete); if (!ks.length) return '';
      const op = Math.round(100 * ks.reduce((s, k) => s + krProgress(k), 0) / ks.length);
      return `<section class="tobj" style="--oc:${objColor(o)}"><div class="tobj-h"><h2>🎯 ${esc(o.text)}</h2><span class="pill">${o.type === 'comprometido' ? '🔒 Comprometido' : '🚀 Aspiracional'}</span><span class="pill" style="font-size:1rem">${op}%</span></div>
      <div class="tracks">${ks.map(k => {
        const p = krProgress(k), stt = krStatus(k), last = k.checkins[k.checkins.length - 1];
        return `<div class="card">
          <div class="kr-sentence">📏 ${esc(krSentence(k))}</div>
          <div class="pbar"><div class="fill" style="width:${Math.max(3, p*100)}%;background:${stt.c}"></div><div class="marker" style="left:${el}%" title="Dónde deberíamos ir según el tiempo"></div><div class="ptxt">${Math.round(p*100)}%</div></div>
          <div class="track-nums"><span>📍 ${fmtVal(k.base, k.unit)}</span><span>Hoy <b>${fmtVal(krCurrent(k), k.unit)}</b></span><span>🏁 ${fmtVal(k.target, k.unit)}</span><span class="pill" style="background:${stt.c}22">${stt.t}</span><span>🙋 ${esc(k.owner || '—')}</span>${last ? `<span>${conf[last.conf] || ''} ${fmtDate(last.date)}</span>` : ''}</div>
          ${sparkline(k)}
          <form class="checkin" data-form="checkin" data-id="${k.id}">
            <input type="number" step="any" name="v" placeholder="Valor de hoy" required>
            <div class="conf" title="¿Qué tan seguros estamos de lograrlo?">${conf.map((e, i) => `<label><input type="radio" name="c" value="${i}" ${i === 1 ? 'checked' : ''}><span>${e}</span></label>`).join('')}</div>
            <input name="n" placeholder="Nota (opcional)">
            <button class="btn primary mut">✔ Registrar</button></form>
          ${k.initiatives.length ? `<div class="ini-check">${k.initiatives.map(n => `<label><input type="checkbox" class="mut" data-change="iniDone" data-id="${n.id}" ${n.done ? 'checked' : ''}><span class="${n.done ? 'done' : ''}">🛠️ ${esc(n.text)}</span></label>`).join('')}</div>` : ''}

async function refreshPart(full){
  const pt = S.part; if (!pt) return;
  try {
    const pid = pt.participant.id;
    const L = await Store.live(pt.code, pid), pub = L.pub;
    if (!pub) { toast('Este taller ya no existe', 'err'); lsDel('okr_part'); clearInterval(partT); S.view = 'join'; return render(); }

}

function findObj(id){ return S.ws.data.objectives.find(o => o.id === id); }
function findKR(id){ for (const o of S.ws.data.objectives) { const k = o.krs.find(k => k.id === id); if (k) return {o, k}; } return {}; }
function findIni(id){ for (const o of S.ws.data.objectives) for (const k of o.krs) { const n = k.initiatives.find(n => n.id === id); if (n) return {o, k, n}; } return {}; }

function onBind(t){
  if (RO()) return;
  const [kind, id, field] = t.dataset.b.split('|');
  let target, val = t.value;
  if (kind === 'ctx') target = S.ws.data.context;
  else if (kind === 'obj') target = findObj(id);
  else if (kind === 'kr') { target = findKR(id).k; if (field === 'base' || field === 'target') val = t.value === '' ? '' : Number(t.value); }
  else if (kind === 'ini') target = findIni(id).n;
  if (!target) return;
  target[field] = val;
  if (kind === 'obj') { const l = $(`[data-live="obj|${id}"]`); if (l) l.innerHTML = objLive(target); if ((target.text || '').trim().split(/\s+/).length >= 3) award('obj' + id, 30, '¡Objetivo escrito! 🎯'); }
  if (kind === 'kr') {
    const l = $(`[data-live="kr|${id}"]`); if (l) l.innerHTML = krLive(target);
    const wv = $(`[data-live="krwarn|${id}"]`); if (wv) wv.innerHTML = krWarn(target);
    if (krComplete(target)) award('kr' + id, 25, '¡Resultado clave listo! 📏');
    if ((target.owner || '').trim().length > 2) award('own' + id, 5, '¡Ya tiene dueño! 🙋');
    drawKRMapSoon();
  }
  if (kind === 'ctx' && val.trim().length > 15) award('ctx_' + field, 10, field === 'mision' ? '¡Misión clara!' : '¡Visión clara!');
  if (kind === 'ini' && field !== 'text' && n_ok(target)) award('inidone' + id, 5, '¡Acción con responsable y fecha!');
  saveSoon(); checkBadges();
}
function n_ok(n){ return (n.owner || '').trim() && n.due; }

function gate(i){
  const objs = validObjs();
  if (i === 2 && !objs.length) return {hard:true, msg:'🎯 Escriban al menos un objetivo'};
  if (i === 3 && objs.some(o => !o.krs.some(krComplete))) return {hard:true, msg:'📏 Cada objetivo necesita al menos un resultado clave completo (hoy y meta)'};
  if (i === 4 && allKRs().some(k => !k.initiatives.length)) return {msg:'Algunos resultados clave aún no tienen acciones. ¿Quieren seguir?'};
  if (i === 5 && qualityScore() < 60) return {msg:`La calificación es ${qualityScore()}. ¿Seguimos o mejoramos primero?`};
  return null;
}

const DETAIL_HEAD = ['Objetivo','Tipo','Por qué','Resultado clave','Unidad','Hoy (inicio)','Meta','Actual','Avance %','Dueño','Acción','Responsable','Fecha','Hecha'];
function withWs(w, fn){ const prev = S.ws; S.ws = w; try { return fn(); } finally { S.ws = prev; } }
function detailRows(w){
  return withWs(w, () => {
    const rows = [];
    validObjs().forEach(o => {
      if (!o.krs.length) rows.push([o.text, o.type, o.why]);
      o.krs.forEach(k => {
        const base = [o.text, o.type, o.why, k.metric, k.unit, k.base, k.target, krCurrent(k), Math.round(krProgress(k) * 100), k.owner];
        if (!k.initiatives.length) rows.push(base);
        k.initiatives.forEach(n => rows.push([...base, n.text, n.owner, n.due, n.done ? 'Sí' : 'No']));
      });
    });
    return rows;
  });
}
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_');
function downloadCSV(rows, filename){
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportCSV(){ downloadCSV([DETAIL_HEAD, ...detailRows(S.ws)], `OKR_${slug(S.ws.area + '_' + S.ws.period_label)}.csv`); }
function allWsDetailRows(list){
  const rows = [['Taller','Área','Periodo','Código', ...DETAIL_HEAD]];
  list.forEach(w => { const d = detailRows(w); if (!d.length) rows.push([w.name, w.area, w.period_label, w.code]); d.forEach(r => rows.push([w.name, w.area, w.period_label, w.code, ...r])); });
  return rows;
}

function wsMetrics(w){
  return withWs(w, () => {
    const objs = validObjs(), krs = allKRs(), inis = allInis(), ck = krs.filter(krComplete);
    const st = (S.report.stats || {})[w.id] || {ideas:0, participants:0};
    return {
      objs:objs.length, krs:krs.length, inis:inis.length, done:inis.filter(n => n.done).length,
      ideas:st.ideas, people:st.participants, score:objs.length ? qualityScore() : null,
      prog:ck.length && ck.some(k => k.checkins.length) ? Math.round(100 * ck.reduce((s, k) => s + krProgress(k), 0) / ck.length) : null,
      finished:(w.data.maxPhase || 0) >= 6, checkins:krs.reduce((s, k) => s + k.checkins.length, 0)
    };
  });
}

        <td>${m.finished ? '🏆 ' : ''}${P.icon} ${P.short}</td>
        <td class="n">${m.people}</td><td class="n">${m.ideas}</td><td class="n">${m.objs}</td><td class="n">${m.krs}</td><td class="n">${m.done}/${m.inis}</td>
        <td class="n">${m.score === null ? '—' : `<span class="pill" style="background:${m.score >= 80 ? '#D1FAE5' : m.score >= 55 ? '#FEF3C7' : '#FEE2E2'}">${m.score}</span>`}</td>
        <td class="n">${m.prog === null ? '<span class="hint">Sin check-ins</span>' : m.prog + '%'}</td>
        <td>${fmtDate(String(w.updated_at || '').slice(0, 10))}</td>
        <td class="no-print"><button class="btn ghost small" data-act="openWs" data-id="${w.id}">Abrir</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="card empty"><div class="ee">📭</div><p>Este cliente aún no tiene talleres.</p></div>'}
    ${ms.map(({w, m}) => withWs(w, () => { const krs = allKRs().filter(krComplete); return `<section class="rdetail">
      <h2 class="sec-t">🧩 ${esc(w.name)} <span class="hint" style="font-family:Nunito;font-size:1rem">· ${esc(w.area)} · ${esc(w.period_label)}</span></h2>
      ${m.objs ? posterHTML() : '<p class="hint">Aún no tiene objetivos.</p>'}
      ${krs.length ? `<div class="card" style="margin-top:12px;padding:0;overflow:auto"><table class="rtable"><thead><tr><th>Objetivo</th><th>Resultado clave</th><th>Inicio</th><th>Actual</th><th>Meta</th><th>Avance</th><th>Estado</th><th>Dueño</th></tr></thead><tbody>
        ${validObjs().flatMap(o => o.krs.filter(krComplete).map(k => { const st = krStatus(k); return `<tr><td>${esc(short(o.text, 50))}</td><td>${esc(k.metric)}</td><td class="n">${fmtVal(k.base, k.unit)}</td><td class="n"><b>${fmtVal(krCurrent(k), k.unit)}</b></td><td class="n">${fmtVal(k.target, k.unit)}</td><td class="n">${Math.round(krProgress(k) * 100)}%</td><td>${k.checkins.length ? st.t : '<span class="hint">Sin check-ins</span>'}</td><td>${esc(k.owner || '—')}</td></tr>`; })).join('')}
      </tbody></table></div>` : ''}</section>`; })).join('')}
  </main>`;
}
async function openReport(cid, back){
  try {
    const client = await Store.getClient(cid);
    const [list, stats] = await Promise.all([Store.listWorkshops(cid), Store.workshopStats(cid)]);
    S.report = {client, workshops:list.map(w => ensureData(JSON.parse(JSON.stringify(w)))), stats, back};
    S.view = 'report'; render(); window.scrollTo(0, 0);
  } catch(e) { toast(esc(e.message), 'err'); }
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async function boot(){
  try {
    const r = await fetch('/api', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({action:'ping'})});
    if (r.ok) { const j = await r.json(); if (j && j.ok) { DEMO = false; Store = ApiStore; API_CONFIGURED = !!j.configured; } }
  } catch(e) {}
  const code = new URLSearchParams(location.search).get('code');
  if (code) {
    const sv = getPart();
    if (sv && sv.code === code.toUpperCase()) { S.part = sv; return openParticipant(); }
    S.joinCode = code.toUpperCase(); S.view = 'join'; return render();
  }
  try { S.user = await Store.current(); } catch(e) {}
  if (S.user) return goHome();
  S.view = 'landing'; render();
})();
</script>
</body>
